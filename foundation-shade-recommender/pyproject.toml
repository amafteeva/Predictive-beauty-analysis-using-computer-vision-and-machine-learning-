[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-shade-matcher"
version = "0.1.0"
description = "Selfie-based foundation shade recommendation with CIELAB and CIEDE2000"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "matplotlib>=3.8",
    "mediapipe>=0.10.14",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.1",
    "Pillow>=10.2",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
