[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-shade-matcher"
version = "0.1.0"
description = "Selfie-based foundation shade recommendation with CIELAB and CIEDE2000"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "langdetect>=1.0.9",
    "matplotlib>=3.8",
    "mediapipe>=0.10.14,<1.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pandas>=2.1",
    "Pillow>=10.2",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Only needed for the optional DistilBERT fine-tuning experiment
# (foundation_matcher.review_transformer). The shade-matching pipeline and
# the TF-IDF/logistic-regression review baseline never import these.
transformers = [
    "torch>=2.2",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
